<head>

<title>Foreword: Privacy Policy (moved)</title>
<meta name="robots" content="noindex">

  The Foreword privacy policy moved to penandstring.github.io on 27 September

  redirect. The script runs first because it keeps the #anchor (Play's
  account-deletion URL is #delete-your-data); the meta refresh is for a reader
  with scripts off.
-->
<script>location.replace('https://penandstring.github.io/foreword/privacy/' + location.hash);</script>
<meta http-equiv="refresh" content="0; url=https://penandstring.github.io/foreword/privacy/">

  main { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <p>The Foreword privacy policy has moved to

</body>
